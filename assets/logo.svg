<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#3D8DFF"/>
      <stop offset="1" stop-color="#8C60FF"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EEC498"/>
      <stop offset="0.55" stop-color="#D69E64"/>
      <stop offset="1" stop-color="#966034"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2E8F0"/>
      <stop offset="1" stop-color="#949EAC"/>
    </linearGradient>
    <linearGradient id="ropeHi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="tileClip">
      <rect x="0" y="0" width="256" height="256" rx="58"/>
    </clipPath>
  </defs>

  <!-- Fluent tile -->
  <g clip-path="url(#tileClip)">
    <rect width="256" height="256" fill="url(#tile)"/>
    <rect width="256" height="256" fill="url(#glow)"/>

    <!-- the clothesline, sagging from edge to edge -->
    <path d="M -14 88 Q 128 116 270 88" fill="none" stroke="#3E4859"
          stroke-width="7.5" stroke-linecap="round" opacity="0.55" transform="translate(0,3)"/>
    <path d="M -14 88 Q 128 116 270 88" fill="none" stroke="#787E8A"
          stroke-width="7.5" stroke-linecap="round"/>
    <path d="M -14 87 Q 128 115 270 87" fill="none" stroke="url(#ropeHi)"
          stroke-width="2.2" stroke-linecap="round"/>

    <!-- the clothespin hanging from the line -->
    <g>
      <ellipse cx="128" cy="178" rx="19" ry="5" fill="#141E3C" opacity="0.16"/>
      <path d="M 109 86 h 38 v 82 a 12 12 0 0 1 -12 12 h -14 a 12 12 0 0 1 -12 -12 Z"
            fill="url(#wood)"/>
      <path d="M 109 86 h 38 v 82 a 12 12 0 0 1 -12 12 h -14 a 12 12 0 0 1 -12 -12 Z"
            fill="none" stroke="rgba(120,74,38,0.35)" stroke-width="1.5"/>
      <rect x="122" y="100" width="12" height="3.6" rx="1.8" fill="#342618" opacity="0.85"/>
      <line x1="128" y1="106" x2="128" y2="166" stroke="#5C3A1C" stroke-width="2" opacity="0.75"/>
      <rect x="121" y="118" width="14" height="14" rx="3" fill="url(#band)"
              stroke="#5C6480" stroke-width="1.4"/>
      <rect x="112.5" y="92" width="3.6" height="78" rx="1.8" fill="#FFF0DC" opacity="0.35"/>
    </g>
  </g>
  <rect x="1" y="1" width="254" height="254" rx="57" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.6"/>
</svg>
